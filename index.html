<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151621">
   <title></title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap");

    :root {
      --night: #10121e;
      --charcoal: #171925;
      --navy: #1d1f31;
      --surface: rgba(38, 39, 57, 0.84);
      --surface-bright: #2b2c43;
      --surface-muted: rgba(30, 31, 47, 0.82);
      --lavender: #b9a8d8;
      --lavender-bright: #d8caf0;
      --amber: #efbc76;
      --amber-soft: #f5d39d;
       --text: #e8e4f0;
       --text-muted: #c8c2d2;
       --text-soft: #aaa4b7;
      --line: rgba(221, 209, 239, 0.15);
      --line-bright: rgba(221, 209, 239, 0.28);
      --dim-opacity: 0.18;
       --content-width: 560px;
      --radius-xl: 32px;
      --radius-lg: 26px;
      --radius-md: 18px;
      --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--night);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 9% 6%, rgba(130, 106, 175, 0.16), transparent 31rem),
        radial-gradient(circle at 93% 31%, rgba(201, 137, 67, 0.1), transparent 27rem),
        linear-gradient(160deg, var(--charcoal), var(--night) 66%);
      color: var(--text);
      font-family: "Quicksand", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button,
    label,
    input[type="range"] {
      touch-action: manipulation;
    }

    button {
      border: 0;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid var(--amber-soft);
      outline-offset: 4px;
    }

    .page-shell {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      overflow: hidden;
      transition: opacity 3s var(--ease-soft);
    }

    .page-shell.sleeping {
      opacity: 0.04;
    }

    .page-shell::before,
    .page-shell::after {
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
      content: "";
    }

    /* A quiet field of tiny dots keeps the page feeling awake without competing with the note. */
    .page-shell::before {
      opacity: 0.52;
      background-image:
        radial-gradient(circle at 7% 18%, rgba(239, 188, 118, 0.58) 0 1px, transparent 1.8px),
        radial-gradient(circle at 23% 72%, rgba(216, 202, 240, 0.42) 0 1px, transparent 1.8px),
        radial-gradient(circle at 47% 22%, rgba(216, 202, 240, 0.45) 0 1.3px, transparent 2px),
        radial-gradient(circle at 69% 82%, rgba(239, 188, 118, 0.48) 0 1px, transparent 1.8px),
        radial-gradient(circle at 89% 13%, rgba(216, 202, 240, 0.48) 0 1px, transparent 1.8px),
        radial-gradient(circle at 94% 63%, rgba(216, 202, 240, 0.33) 0 1.4px, transparent 2px);
      animation: drift-dots 26s ease-in-out infinite alternate;
    }

    .page-shell::after {
      background: radial-gradient(ellipse at 50% 0%, transparent 16%, rgba(8, 9, 17, 0.2) 77%);
    }

    .dim-layer {
      position: fixed;
      z-index: 20;
      inset: 0;
      pointer-events: none;
      background: rgb(0 0 0 / var(--dim-opacity));
    }

    .content-wrap {
      width: min(100% - 40px, var(--content-width));
      margin-inline: auto;
    }

    .site-header {
      padding: 48px 0 38px;
    }

     .header-inner {
       display: grid;
       gap: 24px;
     }

    .header-main {
      position: relative;
      max-width: 650px;
    }

     .greeting {
       margin-bottom: 12px;
       color: var(--amber-soft);
       font-size: 0.82rem;
       font-weight: 600;
       letter-spacing: 0.04em;
     }

     .title-line {
       display: flex;
       gap: 14px;
       align-items: center;
     }

     .moon-mark {
       flex: 0 0 auto;
       width: 42px;
       height: 42px;
       filter: drop-shadow(0 0 16px rgb(185 168 216 / 0.28));
     }

    .moon-mark .moon {
      fill: var(--lavender-bright);
    }

    .moon-mark .star {
      fill: var(--amber-soft);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1,
    h2 {
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1.08;
    }

     h1 {
       max-width: none;
       font-size: clamp(1.8rem, 7vw, 2.1rem);
       white-space: nowrap;
     }

    .subtitle {
      margin-top: 15px;
      color: var(--text-muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

     .screen-control {
       display: grid;
       width: 100%;
       gap: 8px;
       color: var(--text-muted);
       font-size: 0.82rem;
       font-weight: 600;
    }

    .screen-control label {
      grid-column: 1 / -1;
      color: var(--amber-soft);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
    }

     .range-wrap {
       display: flex;
       width: 100%;
       align-items: center;
       gap: 12px;
     }

    .range-wrap span {
      display: none;
    }

    input[type="range"] {
      width: 100%;
      min-height: 44px;
      margin: 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 5px;
      border: 1px solid rgb(216 202 240 / 0.18);
      border-radius: 999px;
      background: rgb(255 255 255 / 0.12);
    }

    input[type="range"]::-moz-range-track {
      height: 5px;
      border: 1px solid rgb(216 202 240 / 0.18);
      border-radius: 999px;
      background: rgb(255 255 255 / 0.12);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 20px;
      height: 20px;
      margin-top: -8px;
      appearance: none;
      border: 3px solid var(--charcoal);
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 2px var(--amber-soft), 0 0 16px rgb(239 188 118 / 0.25);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 3px solid var(--charcoal);
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 2px var(--amber-soft), 0 0 16px rgb(239 188 118 / 0.25);
    }

    main {
      position: relative;
      z-index: 1;
    }

    .content-section + .content-section {
      margin-top: 72px;
    }

    .section-heading {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      align-items: baseline;
      margin-bottom: 19px;
    }

    .section-heading h2 {
      font-size: clamp(1.35rem, 4vw, 1.8rem);
    }

    .section-label {
      color: var(--amber-soft);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .note-card,
    .breathing-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgb(47 47 68 / 0.88), rgb(32 33 49 / 0.86));
      box-shadow: 0 24px 60px rgb(4 5 12 / 0.19), inset 0 1px 0 rgb(255 255 255 / 0.035);
    }

    .note-card {
      padding: 25px 22px;
    }

    .note-copy {
      display: grid;
      gap: 23px;
    }

     .note-copy p {
       color: var(--text-muted);
       font-size: 1.1rem;
       font-weight: 500;
       line-height: 1.78;
       overflow-wrap: anywhere;
       opacity: 0;
       transform: translateY(9px);
       animation: note-in 0.9s var(--ease-soft) forwards;
       animation-delay: var(--note-delay);
     }

     .phrase-highlight {
       color: var(--amber-soft);
       font-weight: 700;
       text-shadow: 0 0 18px rgb(239 188 118 / 0.16);
     }

     .breathing-card {
       display: grid;
       gap: 26px;
       padding: 27px 22px 25px;
       text-align: center;
    }

    .breathing-intro {
      margin-inline: auto;
      max-width: 29ch;
      color: var(--text-muted);
      font-size: 0.96rem;
      font-weight: 500;
    }

     .breath-stage {
       display: grid;
       min-height: 250px;
       place-items: center;
     }

     .breath-orb {
       position: relative;
       display: grid;
       width: clamp(180px, 60vw, 210px);
       aspect-ratio: 1;
       place-items: center;
       border: 1px solid rgb(239 188 118 / 0.68);
       border-radius: 50%;
       background:
         radial-gradient(circle at 35% 30%, rgb(245 211 157 / 0.74), transparent 12%),
         radial-gradient(circle, rgb(185 168 216 / 0.48), rgb(112 92 153 / 0.24) 55%, rgb(239 188 118 / 0.08) 70%, transparent 71%);
       box-shadow: 0 0 0 16px rgb(185 168 216 / 0.065), 0 0 62px rgb(185 168 216 / 0.3), inset 0 0 28px rgb(255 238 210 / 0.13);
       transform: scale(0.72);
       animation: breathe 10s ease-in-out infinite;
     }

    .breath-orb::after {
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgb(255 240 211 / 0.36);
      box-shadow: 0 0 28px rgb(255 231 186 / 0.4);
      content: "";
      opacity: 0.72;
    }

     .breath-label {
       position: absolute;
       inset: 0;
       z-index: 2;
       display: grid;
       margin: 0;
       place-items: center;
       color: var(--amber-soft);
       font-size: 1.02rem;
       font-weight: 700;
       letter-spacing: 0.04em;
       opacity: 1;
       transition: opacity 430ms ease;
     }

     .breath-label.is-changing {
       opacity: 0;
     }

    .checklist {
      display: grid;
      gap: 11px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .check-item {
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: 7px 14px 7px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-muted);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      transition: border-color 220ms ease, background-color 220ms ease, transform 220ms var(--ease-soft);
    }

    .check-item:hover {
      border-color: var(--line-bright);
      background: rgb(50 50 72 / 0.88);
    }

    .check-item:active {
      transform: scale(0.985);
    }

    .check-item:focus-within {
      border-color: var(--amber-soft);
      box-shadow: 0 0 0 3px rgb(245 211 157 / 0.2);
    }

    .check-item input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

     .check-box {
       display: grid;
       flex: 0 0 32px;
       width: 32px;
       height: 32px;
       margin-right: 12px;
       place-items: center;
       border: 1px solid rgb(216 202 240 / 0.38);
       border-radius: 10px;
       background: rgb(255 255 255 / 0.025);
       transition: border-color 260ms ease, background-color 260ms ease, transform 260ms var(--ease-soft);
     }

     .check-box::after {
       width: 8px;
       height: 14px;
       border-right: 2px solid var(--charcoal);
       border-bottom: 2px solid var(--charcoal);
      content: "";
      opacity: 0;
      transform: translateY(-2px) rotate(40deg) scale(0.55);
      transition: opacity 220ms ease, transform 320ms var(--ease-soft);
    }

    .check-item input:checked + .check-box {
      border-color: var(--amber-soft);
      background: var(--amber-soft);
      animation: check-settle 420ms var(--ease-soft);
    }

    .check-item input:checked + .check-box::after {
      opacity: 1;
      transform: translateY(-2px) rotate(40deg) scale(1);
    }

    .check-item input:checked ~ .check-text {
      color: var(--text-soft);
      text-decoration: line-through;
      text-decoration-color: rgb(245 211 157 / 0.5);
      text-decoration-thickness: 1px;
    }

    .helper-line {
      margin-top: 14px;
      color: var(--text-soft);
      font-size: 0.82rem;
      font-weight: 600;
    }

     .medicine-groups {
       display: grid;
       gap: 18px;
     }

     .medicine-group {
       display: grid;
       gap: 10px;
     }

     .medicine-group-heading {
       display: flex;
       flex-wrap: wrap;
       gap: 5px 10px;
       align-items: baseline;
       padding-inline: 4px;
     }

     .medicine-group-heading h3 {
       margin: 0;
       color: var(--text-muted);
       font-size: 0.95rem;
       font-weight: 700;
       letter-spacing: -0.01em;
     }

     .medicine-group-heading span {
       color: var(--text-soft);
       font-size: 0.75rem;
       font-weight: 600;
       letter-spacing: 0.04em;
     }

     .medicine-list {
       display: grid;
       gap: 10px;
       padding: 0;
       margin: 0;
       list-style: none;
     }

     .medicine-card {
       display: grid;
       grid-template-columns: minmax(0, 1fr);
       gap: 14px;
       padding: 15px;
       border: 1px solid var(--line);
       border-radius: var(--radius-md);
       background: var(--surface-muted);
       transition: border-color 220ms ease, background-color 220ms ease;
     }

     .medicine-card.is-taken {
       border-color: rgb(239 188 118 / 0.35);
       background: linear-gradient(145deg, rgb(55 50 65 / 0.88), rgb(31 32 47 / 0.86));
     }

     .medicine-card.is-sos {
       border-color: rgb(239 188 118 / 0.24);
     }

     .medicine-card-main {
       display: grid;
       grid-template-columns: 12px minmax(0, 1fr);
       gap: 11px;
       align-items: start;
       min-width: 0;
     }

     .medicine-status-dot {
       width: 10px;
       height: 10px;
       margin-top: 7px;
       border: 1px solid rgb(216 202 240 / 0.58);
       border-radius: 50%;
       background: transparent;
     }

     .medicine-status-dot.is-taken {
       border-color: var(--amber-soft);
       background: var(--amber-soft);
       box-shadow: 0 0 0 3px rgb(239 188 118 / 0.1);
     }

     .medicine-status-dot.is-sos {
       border-color: var(--amber-soft);
       background: rgb(239 188 118 / 0.28);
     }

     .medicine-copy {
       min-width: 0;
     }

     .medicine-name {
       color: var(--text);
       font-size: 1rem;
       font-weight: 700;
       overflow-wrap: anywhere;
     }

     .medicine-timing {
       margin-top: 3px;
       color: var(--text-muted);
       font-size: 0.88rem;
       font-weight: 500;
       overflow-wrap: anywhere;
     }

     .medicine-status {
       margin-top: 6px;
       color: var(--text-soft);
       font-size: 0.76rem;
       font-weight: 600;
     }

     .medicine-card.is-taken .medicine-status {
       color: var(--amber-soft);
     }

     .medicine-action,
     .medicine-edit-toggle,
     .medicine-save,
     .medicine-cancel,
     .medicine-undo {
       display: inline-flex;
       min-height: 44px;
       align-items: center;
       justify-content: center;
       padding: 9px 14px;
       border: 1px solid rgb(216 202 240 / 0.23);
       border-radius: 999px;
       color: var(--text-muted);
       background: rgb(185 168 216 / 0.12);
       font-size: 0.8rem;
       font-weight: 700;
       cursor: pointer;
       transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, transform 220ms var(--ease-soft);
     }

     .medicine-action {
       width: 100%;
     }

     .medicine-action:hover,
     .medicine-edit-toggle:hover,
     .medicine-cancel:hover,
     .medicine-undo:hover {
       border-color: rgb(216 202 240 / 0.4);
       color: var(--text);
       background: rgb(185 168 216 / 0.2);
     }

     .medicine-action:active,
     .medicine-edit-toggle:active,
     .medicine-save:active,
     .medicine-cancel:active,
     .medicine-undo:active {
       transform: scale(0.975);
     }

     .medicine-card.is-taken .medicine-action {
       border-color: rgb(239 188 118 / 0.38);
       color: var(--amber-soft);
       background: rgb(239 188 118 / 0.12);
     }

     .medicine-tools {
       display: grid;
       gap: 14px;
       margin-top: 17px;
     }

     .medicine-disclaimer {
       color: var(--text-soft);
       font-size: 0.82rem;
       font-weight: 600;
     }

     .medicine-edit-toggle {
       width: 100%;
     }

     .medicine-feedback {
       display: flex;
       flex-wrap: wrap;
       gap: 9px 13px;
       align-items: center;
       min-height: 26px;
       margin-top: 14px;
       color: var(--amber-soft);
       font-size: 0.82rem;
       font-weight: 600;
     }

     .medicine-feedback:empty {
       display: none;
     }

     .medicine-undo {
       min-height: 38px;
       padding: 6px 12px;
       color: var(--amber-soft);
       background: transparent;
     }

     .medicine-editor {
       display: grid;
       gap: 14px;
       padding: 17px;
       margin-top: 15px;
       border: 1px solid rgb(185 168 216 / 0.24);
       border-radius: var(--radius-lg);
       background: linear-gradient(145deg, rgb(47 47 68 / 0.72), rgb(30 31 47 / 0.76));
     }

     .medicine-editor[hidden] {
       display: none;
     }

     .medicine-editor-intro {
       color: var(--text-muted);
       font-size: 0.86rem;
       font-weight: 500;
     }

     .medicine-editor-fields {
       display: grid;
       gap: 11px;
     }

     .medicine-edit-card {
       display: grid;
       gap: 7px;
       min-width: 0;
       padding: 13px;
       margin: 0;
       border: 1px solid var(--line);
       border-radius: var(--radius-md);
       background: rgb(24 25 39 / 0.5);
     }

     .medicine-edit-card legend {
       max-width: 100%;
       padding: 0 5px;
       color: var(--amber-soft);
       font-size: 0.78rem;
       font-weight: 700;
       letter-spacing: 0.04em;
       overflow-wrap: anywhere;
     }

     .medicine-edit-card label {
       color: var(--text-soft);
       font-size: 0.76rem;
       font-weight: 700;
     }

     .medicine-edit-card input[type="text"] {
       width: 100%;
       min-height: 46px;
       padding: 9px 11px;
       border: 1px solid rgb(216 202 240 / 0.22);
       border-radius: 12px;
       color: var(--text);
       background: rgb(16 18 30 / 0.55);
     }

     .medicine-edit-card input[type="text"]::placeholder {
       color: var(--text-soft);
     }

     .medicine-edit-card input[aria-invalid="true"] {
       border-color: rgb(239 188 118 / 0.58);
     }

     .medicine-editor-actions {
       display: grid;
       gap: 10px;
     }

     .medicine-save {
       border-color: rgb(239 188 118 / 0.48);
       color: var(--charcoal);
       background: var(--amber-soft);
     }

     .medicine-save:hover {
       border-color: var(--amber-soft);
       background: #f7ddb1;
     }

     .medicine-cancel {
       background: transparent;
     }

     .medicine-editor-message {
       min-height: 22px;
       color: var(--amber-soft);
       font-size: 0.78rem;
       font-weight: 600;
     }

    .thought-box {
      display: grid;
      gap: 17px;
      padding: 23px;
      border: 1px solid rgb(185 168 216 / 0.2);
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgb(73 60 99 / 0.42), rgb(44 44 65 / 0.7));
    }

    .thought-button,
    .sleep-button {
      display: inline-flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 12px 19px;
      border-radius: 999px;
      color: var(--charcoal);
      font-weight: 700;
      cursor: pointer;
      transition: background-color 220ms ease, box-shadow 220ms ease, transform 220ms var(--ease-soft);
    }

     .thought-button {
       color: var(--text-muted);
       background: rgb(185 168 216 / 0.16);
       border: 1px solid rgb(216 202 240 / 0.2);
       box-shadow: none;
     }

     .thought-button:hover {
       color: var(--text);
       background: rgb(185 168 216 / 0.22);
       border-color: rgb(216 202 240 / 0.3);
       box-shadow: none;
    }

    .thought-button:active,
    .sleep-button:active {
      transform: scale(0.975);
    }

    .thought-result {
      min-height: 28px;
      color: var(--text);
      font-size: 1.02rem;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 500ms ease, transform 500ms var(--ease-soft);
    }

     .thought-result.is-visible {
       opacity: 1;
       transform: none;
     }

      .comfort-section {
        scroll-margin-top: 24px;
      }

      .comfort-entry {
        padding: 18px;
        border: 1px solid rgb(185 168 216 / 0.22);
        border-radius: var(--radius-xl);
        background: linear-gradient(145deg, rgb(57 48 76 / 0.56), rgb(31 31 48 / 0.78));
      }

      .comfort-open,
      .comfort-close {
        display: inline-flex;
        width: 100%;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border: 1px solid rgb(216 202 240 / 0.26);
        border-radius: 999px;
        color: var(--text);
        background: rgb(185 168 216 / 0.12);
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, transform 220ms var(--ease-soft);
      }

      .comfort-open:hover,
      .comfort-close:hover {
        border-color: rgb(216 202 240 / 0.42);
        background: rgb(185 168 216 / 0.2);
      }

      .comfort-open:active,
      .comfort-close:active {
        transform: scale(0.98);
      }

      .comfort-panel {
        display: grid;
        gap: 22px;
        padding: 24px 18px 19px;
        border: 1px solid rgb(185 168 216 / 0.25);

        font-size: 0.96rem;
        font-weight: 700;
        line-height: 1.45;
        cursor: pointer;
        list-style: none;

      .comfort-question::-webkit-details-marker {

        color: var(--amber-soft);
        content: "⌄";
        font-size: 1.1rem;
        line-height: 1;
        transform: translateY(-2px);
        transition: transform 220ms var(--ease-soft);
      }

      .comfort-letter[open] .comfort-question {
        color: var(--text);
      }

        transform: rotate(180deg) translateY(-2px);
      }

      .comfort-letter:not([open]) .comfort-answer {
        display: none;
      }

        position: relative;
        z-index: 1;
        outline: 3px solid var(--amber-soft);
        outline-offset: -3px;
      }

        gap: 15px;
        padding: 0 15px 17px;
        color: var(--text-muted);

        font-weight: 500;

      }

     $("#dim-range").setAttribute("aria-label", CONFIG.labels.dimScreen);

     $("#note-heading").textContent = CONFIG.labels.note;
     $("#breathing-heading").textContent = CONFIG.labels.breathing;
     $("#checklist-heading").textContent = CONFIG.labels.checklist;
     $("#checklist-helper").textContent = CONFIG.labels.checklistHelper;
      $("#medicine-heading").textContent = CONFIG.labels.medicine;
      $("#medicine-disclaimer").textContent = CONFIG.labels.medicineDisclaimer;
      $("#medicine-edit-toggle").textContent = CONFIG.labels.medicineEdit;
      $("#medicine-editor-intro").textContent = CONFIG.labels.medicineEditorIntro;
      $("#medicine-save").textContent = CONFIG.labels.medicineSave;
      $("#medicine-cancel").textContent = CONFIG.labels.medicineCancel;
      $("#thought-heading").textContent = CONFIG.labels.thought;
      $("#thought-button").textContent = CONFIG.labels.gentleThought;
      $("#comfort-heading").textContent = CONFIG.labels.comfortTitle;
      $("#comfort-subtitle").textContent = CONFIG.labels.comfortSubtitle;
      $("#comfort-open").textContent = CONFIG.labels.comfortOpen;
      $("#comfort-close").textContent = CONFIG.labels.comfortClose;
      $("#memories-heading").textContent = CONFIG.labels.memories;
     $("#sleep-heading").textContent = CONFIG.labels.sleep;
     $("#sleep-button-label").textContent = CONFIG.labels.sleepButton;
     $("#sleep-message").textContent = CONFIG.labels.sleepMessage;

     const noteCopy = $("#note-copy");
     const highlightPattern = new RegExp(`(${CONFIG.highlightPhrases.join("|")})`, "g");
     CONFIG.note.forEach((paragraph, index) => {
       const element = document.createElement("p");
       element.style.setProperty("--note-delay", `${index * 1.5}s`);
       let cursor = 0;
       paragraph.replace(highlightPattern, (match, _capture, offset) => {
         element.append(document.createTextNode(paragraph.slice(cursor, offset)));
         const highlight = document.createElement("span");
         highlight.className = "phrase-highlight";
         highlight.textContent = match;
         element.append(highlight);
         cursor = offset + match.length;
          return match;
        });
       element.append(document.createTextNode(paragraph.slice(cursor)));
       noteCopy.append(element);
     });

    const checklist = $("#checklist");
    CONFIG.checklist.forEach((item, index) => {
      const listItem = document.createElement("li");
      const label = document.createElement("label");
      const input = document.createElement("input");
      const checkBox = document.createElement("span");
      const copy = document.createElement("span");

      input.type = "checkbox";
      input.id = `check-${index + 1}`;
      input.setAttribute("aria-label", item);
      checkBox.className = "check-box";
      checkBox.setAttribute("aria-hidden", "true");
      copy.className = "check-text";
      copy.textContent = item;
      label.className = "check-item";
      label.htmlFor = input.id;

      label.append(input, checkBox, copy);
      listItem.append(label);
       checklist.append(listItem);
      });

     const MEDICINE_STORAGE_KEY = "manee-medicine-tracker-v1";
     const medicineGroupOrder = ["morning", "evening", "sos"];

     const getMedicineDateKey = (date = new Date()) => [
       date.getFullYear(),
       String(date.getMonth() + 1).padStart(2, "0"),
       String(date.getDate()).padStart(2, "0")
     ].join("-");

     const cloneDefaultMedicines = () => CONFIG.medicines.map((medicine) => ({ ...medicine }));

     const normalizeMedicine = (medicine) => {
       if (!medicine || typeof medicine !== "object") return null;
       if (typeof medicine.id !== "string" || !medicine.id) return null;
       if (!medicineGroupOrder.includes(medicine.group)) return null;
       if (typeof medicine.name !== "string" || !medicine.name.trim()) return null;
       if (typeof medicine.timing !== "string" || !medicine.timing.trim()) return null;

       return {
         id: medicine.id,
         group: medicine.group,
         name: medicine.name.trim(),
         timing: medicine.timing.trim(),
         scheduled: medicine.group !== "sos"
       };
     };

     const loadMedicineState = () => {
       const today = getMedicineDateKey();
       let storedState;

       try {
         storedState = JSON.parse(window.localStorage.getItem(MEDICINE_STORAGE_KEY));
       } catch (_error) {
         storedState = null;
       }

       const storedMedicines = Array.isArray(storedState?.medicines)
         ? storedState.medicines.map(normalizeMedicine).filter(Boolean)
         : [];
       const storedById = new Map(storedMedicines.map((medicine) => [medicine.id, medicine]));
       const defaultMedicines = cloneDefaultMedicines();
       const defaultIds = new Set(defaultMedicines.map((medicine) => medicine.id));
       const medicines = [
         ...defaultMedicines.map((medicine) => storedById.get(medicine.id) || medicine),
         ...storedMedicines.filter((medicine) => !defaultIds.has(medicine.id))
       ];
       const validScheduledIds = new Set(medicines.filter((medicine) => medicine.scheduled).map((medicine) => medicine.id));
       const storedTakenIds = Array.isArray(storedState?.takenIds) ? storedState.takenIds : [];
       const takenIds = storedState?.date === today
         ? [...new Set(storedTakenIds.filter((id) => validScheduledIds.has(id)))]
         : [];

       return { date: today, medicines, takenIds };
     };

     const medicineState = loadMedicineState();

     const saveMedicineState = () => {
       try {
         window.localStorage.setItem(MEDICINE_STORAGE_KEY, JSON.stringify(medicineState));
       } catch (_error) {
         // The tracker still works for this visit if browser storage is unavailable.
       }
     };

     saveMedicineState();

     const medicineGroups = $("#medicine-groups");
     const medicineFeedback = $("#medicine-feedback");
     const medicineEditor = $("#medicine-editor");
     const medicineEditorFields = $("#medicine-editor-fields");
     const medicineEditorMessage = $("#medicine-editor-message");
     const medicineEditToggle = $("#medicine-edit-toggle");

     const findMedicine = (medicineId) => medicineState.medicines.find((medicine) => medicine.id === medicineId);

     const restoreMedicineActionFocus = (medicineId) => {
       const action = [...medicineGroups.querySelectorAll(".medicine-action")]
         .find((button) => button.dataset.medicineId === medicineId);
       action?.focus({ preventScroll: true });
     };

     const setMedicineFeedback = (message, undoMedicineId = null) => {
       medicineFeedback.replaceChildren();
       if (!message) return;

       const messageText = document.createElement("span");
       messageText.textContent = message;
       medicineFeedback.append(messageText);

       if (undoMedicineId) {
         const undoButton = document.createElement("button");
         undoButton.className = "medicine-undo";
         undoButton.type = "button";
         undoButton.textContent = CONFIG.labels.medicineUndo;
         undoButton.addEventListener("click", () => {
           const medicine = findMedicine(undoMedicineId);
           if (!medicine || !medicineState.takenIds.includes(undoMedicineId)) return;
           medicineState.takenIds = medicineState.takenIds.filter((id) => id !== undoMedicineId);
           saveMedicineState();
           renderMedicineTracker();
           restoreMedicineActionFocus(undoMedicineId);
           setMedicineFeedback(`${medicine.name} ${CONFIG.labels.medicineMarkedNotTaken}`);
         });
         medicineFeedback.append(undoButton);
       }
     };

     const toggleMedicineTaken = (medicineId) => {
       resetMedicineDayIfNeeded();
       const medicine = findMedicine(medicineId);
       if (!medicine || !medicine.scheduled) return;

       const wasTaken = medicineState.takenIds.includes(medicineId);
       if (wasTaken) {
         medicineState.takenIds = medicineState.takenIds.filter((id) => id !== medicineId);
         saveMedicineState();
         renderMedicineTracker();
         restoreMedicineActionFocus(medicineId);
         setMedicineFeedback(`${medicine.name} ${CONFIG.labels.medicineMarkedNotTaken}`);
         return;
       }

       medicineState.takenIds = [...medicineState.takenIds, medicineId];
       saveMedicineState();
       renderMedicineTracker();
       restoreMedicineActionFocus(medicineId);
       setMedicineFeedback(`${medicine.name} ${CONFIG.labels.medicineMarkedTaken}`, medicineId);
     };

     const renderMedicineTracker = () => {
       medicineGroups.replaceChildren();

       medicineGroupOrder.forEach((groupName) => {
         const groupMedicines = medicineState.medicines.filter((medicine) => medicine.group === groupName);
         if (!groupMedicines.length) return;

         const group = document.createElement("section");
         group.className = "medicine-group";
         group.setAttribute("aria-labelledby", `medicine-group-${groupName}`);

         const groupHeading = document.createElement("div");
         groupHeading.className = "medicine-group-heading";
         const heading = document.createElement("h3");
         heading.id = `medicine-group-${groupName}`;
         heading.textContent = CONFIG.labels.medicineGroups[groupName];
         const groupType = document.createElement("span");
         groupType.textContent = groupName === "sos"
           ? CONFIG.labels.medicineAsNeededLabel
           : CONFIG.labels.medicineScheduledLabel;
         groupHeading.append(heading, groupType);

         const list = document.createElement("ul");
         list.className = "medicine-list";

         groupMedicines.forEach((medicine) => {
           const taken = medicineState.takenIds.includes(medicine.id);
           const listItem = document.createElement("li");
           const card = document.createElement("article");
           card.className = "medicine-card";
           if (taken) card.classList.add("is-taken");
           if (!medicine.scheduled) card.classList.add("is-sos");

           const main = document.createElement("div");
           main.className = "medicine-card-main";
           const statusDot = document.createElement("span");
           statusDot.className = "medicine-status-dot";
           statusDot.setAttribute("aria-hidden", "true");
           if (taken) statusDot.classList.add("is-taken");
           if (!medicine.scheduled) statusDot.classList.add("is-sos");

           const copy = document.createElement("div");
           copy.className = "medicine-copy";
           const name = document.createElement("p");
           name.className = "medicine-name";
           name.textContent = medicine.name;
           const timing = document.createElement("p");
           timing.className = "medicine-timing";
           timing.textContent = medicine.timing;
           const status = document.createElement("p");
           status.className = "medicine-status";
           status.textContent = medicine.scheduled
             ? (taken ? CONFIG.labels.medicineTaken : CONFIG.labels.medicineNotTaken)
             : CONFIG.labels.medicineAsNeededLabel;
           copy.append(name, timing, status);
           main.append(statusDot, copy);
           card.append(main);

           if (medicine.scheduled) {
             const action = document.createElement("button");
             action.className = "medicine-action";
             action.type = "button";
             action.dataset.medicineId = medicine.id;
             action.setAttribute("aria-pressed", String(taken));
             action.setAttribute("aria-label", `${taken ? CONFIG.labels.medicineUndoTaken : CONFIG.labels.medicineMarkTaken}: ${medicine.name}`);
             action.textContent = taken ? CONFIG.labels.medicineUndoTaken : CONFIG.labels.medicineMarkTaken;
             action.addEventListener("click", () => toggleMedicineTaken(medicine.id));
             card.append(action);
           }

           listItem.append(card);
           list.append(listItem);
         });

         group.append(groupHeading, list);
         medicineGroups.append(group);
       });
     };

     renderMedicineTracker();

     let medicineResetTimer;
     const resetMedicineDayIfNeeded = () => {
       const today = getMedicineDateKey();
       if (medicineState.date === today) return;
       medicineState.date = today;
       medicineState.takenIds = [];
       saveMedicineState();
       renderMedicineTracker();
       setMedicineFeedback("");
     };

     const scheduleMedicineDayReset = () => {
       window.clearTimeout(medicineResetTimer);
       const now = new Date();
       const nextDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
       medicineResetTimer = window.setTimeout(() => {
         resetMedicineDayIfNeeded();
         scheduleMedicineDayReset();
       }, Math.max(1000, nextDay.getTime() - now.getTime()));
     };

     scheduleMedicineDayReset();
     document.addEventListener("visibilitychange", () => {
       if (!document.hidden) resetMedicineDayIfNeeded();
     });
     window.addEventListener("focus", resetMedicineDayIfNeeded);

     const renderMedicineEditor = () => {
       medicineEditorFields.replaceChildren();

       medicineState.medicines.forEach((medicine) => {
         const fieldset = document.createElement("fieldset");
         fieldset.className = "medicine-edit-card";
         fieldset.dataset.medicineId = medicine.id;

         const legend = document.createElement("legend");
         legend.textContent = `${CONFIG.labels.medicineGroups[medicine.group]} · ${medicine.scheduled ? CONFIG.labels.medicineScheduledLabel : CONFIG.labels.medicineAsNeededLabel}`;

         const nameId = `medicine-name-${medicine.id}`;
         const nameLabel = document.createElement("label");
         nameLabel.htmlFor = nameId;
         nameLabel.textContent = CONFIG.labels.medicineNameLabel;
         const nameInput = document.createElement("input");
         nameInput.type = "text";
         nameInput.id = nameId;
         nameInput.name = `name-${medicine.id}`;
         nameInput.value = medicine.name;
         nameInput.setAttribute("aria-required", "true");
         nameInput.dataset.medicineField = "name";

         const timingId = `medicine-timing-${medicine.id}`;
         const timingLabel = document.createElement("label");
         timingLabel.htmlFor = timingId;
         timingLabel.textContent = CONFIG.labels.medicineTimingLabel;
         const timingInput = document.createElement("input");
         timingInput.type = "text";
         timingInput.id = timingId;
         timingInput.name = `timing-${medicine.id}`;
         timingInput.value = medicine.timing;
         timingInput.setAttribute("aria-required", "true");
         timingInput.dataset.medicineField = "timing";

         fieldset.append(legend, nameLabel, nameInput, timingLabel, timingInput);
         medicineEditorFields.append(fieldset);
       });
     };

     const closeMedicineEditor = (shouldFocus = false) => {
       medicineEditor.hidden = true;
       medicineEditToggle.setAttribute("aria-expanded", "false");
       medicineEditToggle.textContent = CONFIG.labels.medicineEdit;
       medicineEditorMessage.textContent = "";
       if (shouldFocus) medicineEditToggle.focus({ preventScroll: true });
     };

     medicineEditToggle.addEventListener("click", () => {
       if (medicineEditor.hidden) {
         renderMedicineEditor();
         medicineEditor.hidden = false;
         medicineEditToggle.setAttribute("aria-expanded", "true");
         medicineEditToggle.textContent = CONFIG.labels.medicineClose;
         medicineEditor.querySelector("input")?.focus({ preventScroll: true });
       } else {
         closeMedicineEditor();
       }
     });

     $("#medicine-cancel").addEventListener("click", () => closeMedicineEditor(true));
     medicineEditor.addEventListener("submit", (event) => {
       event.preventDefault();
       const updatedMedicines = [];
       let firstInvalidInput;

       medicineEditorFields.querySelectorAll(".medicine-edit-card").forEach((fieldset) => {
         const originalMedicine = findMedicine(fieldset.dataset.medicineId);
         const nameInput = fieldset.querySelector('[data-medicine-field="name"]');
         const timingInput = fieldset.querySelector('[data-medicine-field="timing"]');
         const name = nameInput.value.trim();
         const timing = timingInput.value.trim();
         const nameIsInvalid = !name;
         const timingIsInvalid = !timing;
         nameInput.setAttribute("aria-invalid", String(nameIsInvalid));
         timingInput.setAttribute("aria-invalid", String(timingIsInvalid));

         if (nameIsInvalid || timingIsInvalid) {
           firstInvalidInput ||= nameIsInvalid ? nameInput : timingInput;
           return;
         }

         updatedMedicines.push({ ...originalMedicine, name, timing });
       });

       if (firstInvalidInput) {
         medicineEditorMessage.textContent = CONFIG.labels.medicineInvalid;
         firstInvalidInput.focus({ preventScroll: true });
         return;
       }

       medicineState.medicines = updatedMedicines;
       const validScheduledIds = new Set(updatedMedicines.filter((medicine) => medicine.scheduled).map((medicine) => medicine.id));
       medicineState.takenIds = medicineState.takenIds.filter((id) => validScheduledIds.has(id));
       saveMedicineState();
       renderMedicineTracker();
       closeMedicineEditor(true);
       setMedicineFeedback(CONFIG.labels.medicineSaved);
     });

     const memoriesGrid = $("#memories-grid");
     const memoriesSection = document.querySelector('[aria-labelledby="memories-heading"]');
     const realMemories = CONFIG.smileMemories.filter((memory) => memory !== CONFIG.labels.placeholder);
     realMemories.forEach((memory, index) => {
       const card = document.createElement("article");
       card.className = "memory-card";
       card.style.setProperty("--reveal-delay", `${index * 90}ms`);
       card.textContent = memory;
       memoriesGrid.append(card);
     });
     if (realMemories.length === 0) {
       memoriesSection.hidden = true;
     }

    const dimRange = $("#dim-range");
    const updateDim = () => {
      document.documentElement.style.setProperty("--dim-opacity", dimRange.value);
      dimRange.setAttribute("aria-valuetext", `${Math.round(Number(dimRange.value) * 100)}% ${CONFIG.labels.dimScreen}`);
    };
    dimRange.addEventListener("input", updateDim);
     updateDim();

     const breathLabel = $("#breath-label");
     const breathStart = performance.now();
     let lastBreathPhase = "";
     let breathFadeTimer;
     const updateBreathLabel = () => {
       const elapsed = (performance.now() - breathStart) % 10000;
       const nextPhase = elapsed < 4000 ? "breatheIn" : "breatheOut";
       if (nextPhase === lastBreathPhase) return;
       lastBreathPhase = nextPhase;
       window.clearTimeout(breathFadeTimer);
       if (prefersReducedMotion) {
         breathLabel.textContent = CONFIG.labels[nextPhase];
         return;
       }
       breathLabel.classList.add("is-changing");
       breathFadeTimer = window.setTimeout(() => {
         breathLabel.textContent = CONFIG.labels[nextPhase];
         breathLabel.classList.remove("is-changing");
       }, 220);
     };
    updateBreathLabel();
    if (!prefersReducedMotion) {
      window.setInterval(updateBreathLabel, 250);
    }

    const thoughtButton = $("#thought-button");
    const thoughtResult = $("#thought-result");
    let previousThoughtIndex = -1;
     thoughtButton.addEventListener("click", () => {
       let nextIndex = Math.floor(Math.random() * CONFIG.gentleThoughts.length);
       if (CONFIG.gentleThoughts.length > 1 && nextIndex === previousThoughtIndex) {
         nextIndex = (nextIndex + 1) % CONFIG.gentleThoughts.length;
       }
      previousThoughtIndex = nextIndex;
      thoughtResult.classList.remove("is-visible");
      window.setTimeout(() => {
        thoughtResult.textContent = CONFIG.gentleThoughts[nextIndex];
         thoughtResult.classList.add("is-visible");
       }, prefersReducedMotion ? 0 : 80);
     });

      const comfortOpen = $("#comfort-open");
      const comfortEntry = $("#comfort-entry");
      const comfortPanel = $("#comfort-panel");
      const comfortList = $("#comfort-list");
      const comfortClose = $("#comfort-close");

      CONFIG.comfortingMessages.forEach((message) => {
        const letter = document.createElement("details");
        letter.className = "comfort-letter";

        const question = document.createElement("summary");
        question.className = "comfort-question";
        question.textContent = message.title;
        question.addEventListener("click", () => {
          if (letter.open) return;
          comfortList.querySelectorAll(".comfort-letter[open]").forEach((otherLetter) => {
            if (otherLetter !== letter) otherLetter.open = false;
          });
        });

        const answer = document.createElement("div");
        answer.className = "comfort-answer";
        message.answer.forEach((paragraphText) => {
          const paragraph = document.createElement("p");
          paragraph.textContent = paragraphText;
          answer.append(paragraph);
        });

        letter.append(question, answer);
        letter.addEventListener("toggle", () => {
          if (!letter.open) return;
          comfortList.querySelectorAll(".comfort-letter[open]").forEach((otherLetter) => {
            if (otherLetter !== letter) otherLetter.open = false;
          });
        });
        comfortList.append(letter);
      });

      const closeComfortSection = (shouldFocus = false) => {
        comfortList.querySelectorAll(".comfort-letter[open]").forEach((letter) => {
          letter.open = false;
        });
        comfortPanel.hidden = true;
        comfortEntry.hidden = false;
        comfortOpen.setAttribute("aria-expanded", "false");
        if (shouldFocus) comfortOpen.focus({ preventScroll: true });
      };

      comfortOpen.addEventListener("click", () => {
        comfortEntry.hidden = true;
        comfortPanel.hidden = false;
        comfortOpen.setAttribute("aria-expanded", "true");
        comfortList.querySelector("summary")?.focus({ preventScroll: true });
      });

      comfortClose.addEventListener("click", () => closeComfortSection(true));

     const memoryCards = [...document.querySelectorAll(".memory-card")];
    if (prefersReducedMotion || !("IntersectionObserver" in window)) {
      memoryCards.forEach((card) => card.classList.add("is-visible"));
    } else {
      const memoryObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.16, rootMargin: "0px 0px -30px" });
      memoryCards.forEach((card) => memoryObserver.observe(card));
    }

    const pageShell = $("#page-shell");
    const sleepButton = $("#sleep-button");
    const sleepOverlay = $("#sleep-overlay");
    let sleeping = false;

    const enterSleep = () => {
      if (sleeping) return;
      sleeping = true;
      pageShell.classList.add("sleeping");
      sleepOverlay.classList.add("is-active");
      sleepOverlay.setAttribute("aria-hidden", "false");
      sleepButton.setAttribute("aria-pressed", "true");
      sleepOverlay.focus({ preventScroll: true });
    };

    const exitSleep = () => {
      if (!sleeping) return;
      sleeping = false;
      sleepOverlay.classList.remove("is-active");
      pageShell.classList.remove("sleeping");
      sleepOverlay.setAttribute("aria-hidden", "true");
      sleepButton.setAttribute("aria-pressed", "false");
      sleepButton.focus({ preventScroll: true });
    };

    sleepButton.addEventListener("click", enterSleep);
    sleepOverlay.addEventListener("click", exitSleep);
    document.addEventListener("keydown", (event) => {
      if (sleeping) {
        event.preventDefault();
        exitSleep();
      }
    });
  </script>
</body>
</html>
